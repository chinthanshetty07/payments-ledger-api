services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-payments-local-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/payments
      DATABASE_USER: payments
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-payments-local-dev}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
