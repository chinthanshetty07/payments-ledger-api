spring:
  application:
    name: payments-ledger-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DATABASE_USER:payments}
    password: ${DATABASE_PASSWORD:payments-local-dev}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

webhooks:
  scheduler-enabled: true
  poll-ms: 1000
  backoff-base-ms: 1000
  max-attempts: 8
  lease-seconds: 60
